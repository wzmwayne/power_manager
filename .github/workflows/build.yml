name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK（带下载缓存，加速二次构建）
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件（platform 35 + build-tools）
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - name: 配置 Gradle（发行版缓存 + 依赖缓存 + build 缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 提取版本号
        run: |
          VERSION=$(./gradlew -q :app:properties | grep '^versionName:' | awk '{print $2}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: power_manager_v${{ env.VERSION }}.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error